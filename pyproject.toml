[project]
name = "rk-uarch"
version = "0.0.1"
description = "Microarchitecture-level simulator of one AI accelerator, feeding rk-sim"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "numpy", "pyyaml", "typer", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff", "import-linter", "types-PyYAML"]
# U-P10's dry run only. On a Cloud TPU VM, install jax[tpu] per Google's instructions instead.
measure = ["jax[cpu]"]

[project.scripts]
uarch = "rkuarch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rkuarch", "contract/uarch_contract"]

[tool.pytest.ini_options]
testpaths = ["tests", "contract/tests", "validation"]
addopts = "--import-mode=importlib"
pythonpath = [".", "src", "contract"]
markers = [
  "golden: full-request regressions against tests/golden/expected",
  "nightly: slow suites (mutants, L2 differential), run on the Linux box",
  "silicon: needs reference hardware or recorded results",
  "native: needs the built native engine",
  "determinism: byte-identity checks across runs, workers and threads",
]

[tool.ruff]
extend-exclude = ["contract/vendor"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
exclude = ["^contract/vendor/"]
python_version = "3.12"
strict = true
mypy_path = ["src", "contract"]
explicit_package_bases = true
files = ["src/rkuarch", "contract/uarch_contract"]
