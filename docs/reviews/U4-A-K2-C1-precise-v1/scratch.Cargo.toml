[package]
name = "uarch-engine"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip", "arbitrary_precision"] }

sha2 = { version = "=0.10.9", default-features = false, features = ["std", "force-soft"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
