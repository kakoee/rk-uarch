name: nightly
on:
  # PAUSED until U3: no self-hosted runner is registered yet, so scheduled runs queued for 24 h
  # and were cancelled. Re-enable this line when U3 starts, after registering the Linux box
  # (execution-plan U3, "Before it starts"). Manual runs still work via workflow_dispatch.
  # schedule: [{cron: "17 9 * * *"}]
  workflow_dispatch:

# Runs on the Linux box, registered as a self-hosted runner labelled `uarch`.
# Registering it is a human step (GitHub → Settings → Actions → Runners).
jobs:
  nightly:
    runs-on: [self-hosted, linux, uarch]
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --extra dev
      - name: native (nothing yet until U-P11a)
        run: |
          if [ -n "$(find native/crates -name '*.rs' -print -quit 2>/dev/null)" ]; then
            make native-test
          else echo "nothing yet: no native sources"; fi
      - name: nightly suites (mutants, L2)
        run: uv run pytest -q -m nightly || test $? -eq 5
